[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "openut"
version = "0.0.0"
description = "Unofficial runtime and tools for VIVE Ultimate Tracker on Windows + SteamVR"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rytaryu" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff>=0.17,<0.18",
  "mypy>=2.4,<3",
  "pytest>=9.2,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openut"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# UI strings and test data are Japanese: full-width characters are intended.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
