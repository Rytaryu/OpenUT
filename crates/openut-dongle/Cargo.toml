[package]
name = "openut-dongle"
description = "Recording and replay primitives for the VIVE Ultimate Tracker dongle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
openut-anonymize = { path = "../openut-anonymize" }
openut-core = { path = "../openut-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
sysinfo = { version = "0.40.4", default-features = false, features = ["system"] }
