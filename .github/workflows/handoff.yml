name: handoff
# Merges approved PRs whose CI passed, closes the Issues they complete, and
# releases backlog Issues whose start conditions are met, so that neither waits
# for an AI role or the daily PM run (docs/project/roles/README.md, sections 6
# and 7). No AI is involved. Every run is a full, idempotent sweep.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [closed]
  issues:
    types: [closed]
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    # Every hour: the safety net for missed events.
    - cron: '47 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 変更せずに、行うことだけを表示する
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  sweep:
    # One sweep at a time. This is set on the job, not on the workflow: a run
    # that is skipped by the `if` below (an unrelated comment) must not take the
    # place of a waiting sweep.
    concurrency:
      group: handoff
      cancel-in-progress: false
    # Comments start a sweep only when they can change the outcome.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
       (startsWith(github.event.comment.body, 'REVIEW: APPROVE') ||
        contains(github.event.comment.body, 'マージの条件を確認')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Always the default branch: the scripts of a PR never run as this job,
      # and this job never runs a PR's code.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Merge approved PRs, close completed Issues, release the backlog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WAKE_TOKEN: ${{ secrets.WAKE_TOKEN }}
          REPO: ${{ github.repository }}
          WAKE_PR: '1'
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: node .github/scripts/handoff.mjs
