name: CI
# The checks of every PR and of main (docs/project/roles/README.md, section 6. D-8, D-15).
# The hand-off (handoff.yml) merges an approved PR only when this workflow has
# passed on the PR's latest commit, and stops merging while it fails on main.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    # 03:23 JST, every day: main is checked even on days without a push.
    - cron: '23 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        shell: bash
        run: python -m pip install -e ".[dev]"
      - name: Verify
        shell: bash
        env:
          OPENUT_SKIP_SCRIPT_TESTS: '1'
        run: bash .github/scripts/verify.sh

  scripts:
    name: hand-off scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: node --test .github/scripts/*.test.mjs
