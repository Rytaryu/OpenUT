<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenUT メインウィンドウ</title>
<link rel="stylesheet" href="tokens.css">
<script src="wrap.js"></script>
<script src="glyph.js"></script>
<script src="icons.js"></script>
<script src="text.js"></script>
<script src="scenarios.js"></script>
<style>
  /* Values: docs/design/ui/m1.md, chapter 2 (6th version). Open with ?s=a .. ?s=k (scenes in scenarios.js). */
  body { padding: 24px; }
  #win { display: inline-block; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 1px #2A303B; }

  /* Windows draws the title bar (dark, 2.1). Shown here only for the frame. */
  .titlebar { height: 32px; background: #0F1218; display: flex; align-items: center; padding-left: 12px;
              font-size: 12px; color: #C9CED6; gap: 8px; }
  .titlebar .mk { width: 16px; height: 16px; }
  .titlebar .btns { margin-left: auto; display: flex; height: 100%; }
  .titlebar .btns span { width: 46px; display: grid; place-items: center; color: #AEB5BF; font-size: 12px; }

  /* One column that scrolls as a whole (2.2). */
  .client { background: var(--bg); position: relative; overflow: hidden; }
  .scroll { padding: 16px 20px; display: flex; flex-direction: column; height: 100%; overflow: hidden; }
  .scroll > * { flex: none; }
  .cut::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 28px;
                background: linear-gradient(transparent, var(--bg)); pointer-events: none; }
  .vbar { position: absolute; right: 6px; top: 16px; width: 4px; border-radius: 2px; background: var(--idle); }

  /* 1. Status panel: the whole, the one line, the dongle (2.3). Fixed height. */
  .status { height: 96px; background: var(--panel); border-radius: 8px; display: grid;
            grid-template-columns: 168px 1fr auto 184px; align-items: center; }
  .status.tall { height: auto; min-height: 96px; }
  .overall { display: flex; align-items: center; gap: 10px; padding-left: 20px; height: 100%;
             font-size: 22px; font-weight: 700; line-height: 30px; border-right: 1px solid var(--line); }
  .line { padding: 14px 20px; min-width: 0; }
  .line .one { font-size: 16px; line-height: 22px; }
  .line .head { font-size: 16px; line-height: 22px; font-weight: 700; }
  .line .act { font-size: 14px; line-height: 20px; margin-top: 4px; }
  .status .btn.fill { margin-right: 20px; }
  .dongle { display: flex; align-items: center; gap: 12px; padding: 0 20px; height: 100%; border-left: 1px solid var(--line); }
  .dongle .t { display: flex; flex-direction: column; }
  .dongle .k { font-size: 12px; line-height: 16px; color: var(--ink-2); }
  .dongle .v { display: flex; align-items: center; gap: 6px; font-size: 14px; line-height: 20px; font-weight: 700; white-space: nowrap; }

  /* Other live notices, only when there are any (2.3). */
  .notices { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .notice { background: var(--panel); border-radius: 8px; padding: 10px 16px; display: grid;
            grid-template-columns: 16px 1fr; column-gap: 12px; font-size: 14px; line-height: 20px; }
  .notice svg { margin-top: 2px; }
  .notice .t { display: flex; flex-wrap: wrap; column-gap: 16px; }
  .notice .t.col { flex-direction: column; }
  .notice b { font-weight: 700; }
  .grey .notice { color: var(--ink-2); }

  /* 2. Operations: pairing, setup (the button at the right end of each), settings (2.4). */
  .ops { display: grid; grid-template-columns: 1fr 1fr 52px; gap: 12px; margin-top: 12px; height: 52px; }
  .op { background: var(--panel); border-radius: 8px; display: flex; align-items: center; justify-content: space-between;
        padding: 0 9px 0 20px; font-size: 14px; white-space: nowrap; }
  .gearbtn { background: var(--panel); border-radius: 8px; display: grid; place-items: center; color: var(--ink-2); }
  .btn { display: inline-flex; align-items: center; height: 34px; padding: 0 16px; border-radius: 6px;
         box-shadow: inset 0 0 0 1px var(--idle); color: var(--ink); font-size: 14px; font-weight: 700; white-space: nowrap; }
  .btn.fill { box-shadow: none; background: var(--ink); color: var(--on-ink); }
  .btn.small { height: 30px; padding: 0 14px; font-size: 13px; }

  /* 3. The tracker list: a header line and a table of rows of a fixed height (2.5). */
  .listhead { height: 36px; margin-top: 16px; display: flex; align-items: center; justify-content: space-between; }
  .count { font-size: 14px; color: var(--ink-2); }
  .count b { color: var(--ink); font-weight: 700; }
  .table { background: var(--panel); border-radius: 8px; margin-top: 8px; padding: 0 16px; }
  .tr { display: grid; grid-template-columns: 1fr 128px 120px 168px 96px; align-items: center; }
  .th { height: 36px; font-size: 13px; color: var(--ink-2); border-bottom: 1px solid var(--line); }
  .row { min-height: 60px; padding: 10px 0; border-bottom: 1px solid var(--line); position: relative; }
  .row:last-child { border-bottom: 0; }
  .who { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .who .pict { flex: none; }
  .who .name { display: flex; align-items: center; gap: 4px; font-size: 16px; font-weight: 700; line-height: 22px; white-space: nowrap; }
  .who .ser { font-size: 13px; line-height: 18px; white-space: nowrap; }
  .ser .pre { color: var(--ink-2); }
  .ser .tail { font-weight: 700; }
  .st { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; line-height: 20px; white-space: nowrap; }
  .bat { display: flex; align-items: center; gap: 6px; font-size: 14px; line-height: 20px; white-space: nowrap; }
  .bat .ic { margin-left: 2px; }
  .fw { font-size: 14px; line-height: 20px; padding-right: 16px; }
  .unk { color: var(--ink-2); }
  .act { display: flex; gap: 4px; }
  .ib { width: 32px; height: 32px; border-radius: 6px; display: grid; place-items: center; color: var(--ink-2); }
  .ib.open { background: var(--panel-2); color: var(--ink); }
  .row.off .name { color: var(--ink-2); }
  .grey .row .name, .grey .row .ser .tail, .grey .row .fw, .grey .row .bat { color: var(--ink-2); }
  .row.ghost > *:not(.who) { visibility: hidden; }

  /* The row's menu (2.6, provisional): opens under the button, right edges aligned. */
  .popup { position: absolute; right: 0; top: 50px; z-index: 3; background: var(--panel-2); border-radius: 6px;
           box-shadow: 0 0 0 1px var(--line), 0 8px 24px rgba(0, 0, 0, 0.4); padding: 4px; min-width: 160px; }
  .popup div { height: 32px; display: flex; align-items: center; padding: 0 12px; font-size: 14px; border-radius: 4px; white-space: nowrap; }
  .popup div.hl { background: var(--line); }
</style>
</head>
<body>
<div id="win"></div>
<script>
(() => {
  const I = window.OpenUTIcons, X = window.OpenUTText, W = X.words, M = window.OpenUTWrap.measure;
  const key = new URLSearchParams(location.search).get("s") || "a";
  const sc = window.OpenUTScenes[key];
  const [ww, wh] = sc.size || [1120, 640];
  const col = { ok: "var(--ok)", wait: "var(--wait)", fault: "var(--fault)" };
  const grey = !!sc.greyed;
  const c = (k) => (grey ? "var(--muted)" : col[k]);
  const esc = (s) => s.replace(/[&<>]/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[m]));
  const fam = getComputedStyle(document.documentElement).getPropertyValue("--font").trim();
  const K = 0.75; // pictograms: 60 x 48 grid shown at 45 x 36 (1.4)

  // Columns of the table (2.5). The first takes what is left: content width - 32 - 128 - 120 - 168 - 96.
  const tableIn = ww - 40 - 32;
  const whoText = tableIn - 128 - 120 - 168 - 96 - 45 - 14;
  const fwText = 168 - 16;

  // Serial number in a row (2.5): always whole, the tail in Bold. When it does not fit on one line, it is cut
  // into lines from the end, each line as full as it can be, the rest on the first line.
  function serialHtml(serial, tail, w) {
    const R = `400 13px ${fam}`, B = `700 13px ${fam}`;
    const chars = Array.from(serial), t0 = chars.length - Array.from(tail).length;
    const wid = (i) => M(i >= t0 ? B : R, chars[i]);
    const lines = [];
    let end = chars.length;
    while (end > 0) {
      let start = end - 1, sum = wid(start);
      while (start > 0 && sum + wid(start - 1) <= w) sum += wid(--start);
      lines.unshift([start, end]);
      end = start;
    }
    const part = (a, b) => {
      const p = chars.slice(a, Math.min(b, Math.max(a, t0))).join(""), q = chars.slice(Math.max(a, t0), b).join("");
      return (p ? `<span class="pre">${esc(p)}</span>` : "") + (q ? `<span class="tail">${esc(q)}</span>` : "");
    };
    return lines.map(([a, b]) => part(a, b)).join("<br>");
  }

  // Firmware version (2.5): one line when it fits, else broken after a period (or anywhere, for a longer run).
  function fwHtml(v, w) {
    const F = `400 14px ${fam}`, out = [];
    let cur = "";
    for (const tok of v.split(/(?<=\.)/)) {
      if (M(F, cur + tok) <= w) { cur += tok; continue; }
      if (cur) { out.push(cur); cur = ""; }
      for (const ch of tok) { if (cur && M(F, cur + ch) > w) { out.push(cur); cur = ""; } cur += ch; }
    }
    out.push(cur);
    return out.map(esc).join("<br>");
  }

  function row(d, i) {
    const off = d.link === "none";
    const st = d.state;
    const look = off ? "off" : grey ? "grey" : "on";
    const name = (d.host ? I.star(14, grey ? "var(--muted)" : "var(--ink)") : "") +
      `<span>${d.hub ? `${W.tracker}${d.hub}` : W.tracker}</span>`;
    const ser = d.serial ? serialHtml(d.serial, d.tail, whoText) : `<span class="unk">${W.unknown}</span>`;
    // One word for the connection and the state (2.5): 未接続, 同期中, 接続済み, USB接続, 異常.
    const word = X.cardWord(d);
    const stCell = st
      ? `<div class="st" style="color:${c(st)}">${I.state(st, 12, c(st))}<span>${word}</span></div>`
      : `<div class="st" style="color:var(--ink-2)">${I.state("none", 12, grey ? "var(--muted)" : "var(--idle)")}<span>${word}</span></div>`;
    // Battery: nothing on a row that is not connected (design 7.4). The USB mark only when the word is not USB接続.
    const batCell = off ? `<div class="bat"></div>` :
      `<div class="bat">${I.battery(d.battery, d.charging, grey ? "var(--muted)" : "var(--ink)")}` +
      (d.battery == null ? `<span class="unk">${W.unknown}</span>` : `<span>${d.battery}%</span>`) +
      (d.link === "usb" && word !== "USB接続" ? I.usb(grey ? "var(--muted)" : "var(--ink-2)") : "") + `</div>`;
    const fwCell = `<div class="fw">${d.fw ? fwHtml(d.fw, fwText) : `<span class="unk">${W.unknown}</span>`}</div>`;
    const open = sc.menuOpen === i;
    const popup = open ? `<div class="popup"><div class="hl">${W.menu.unpair}</div></div>` : "";
    const actCell = `<div class="act"><span class="ib" title="${W.powerOff}">${I.power()}</span>` +
      `<span class="ib${open ? " open" : ""}" title="${W.menuLabel}">${I.more()}</span></div>`;
    return `<div class="tr row${off && !st ? " off" : ""}">` +
      `<div class="who">${I.tracker(look, K)}<div><div class="name">${name}</div><div class="ser">${ser}</div></div></div>` +
      stCell + batCell + fwCell + actCell + popup + `</div>`;
  }

  // Status panel line (2.3): a notice (headline + action), a problem on the side of the app, or VIVE Hub (G1).
  const lineW = ww - 40 - 168 - 184 - 2 - 40 - (sc.pickFolder ? 128 + 20 : 0);
  const wrapHtml = (s, font, width) => window.OpenUTWrap.wrap(s, font, width).map(esc).join("<br>");
  function lineHtml() {
    const l = sc.line;
    if (!l) return "";
    if (l.fault)
      return `<div class="head">${wrapHtml(l.fault.headline, `700 16px ${fam}`, lineW)}</div>` +
             `<div class="act">${wrapHtml(l.fault.action, `400 14px ${fam}`, lineW)}</div>`;
    return `<div class="one">${wrapHtml(l.hub ? X.hubLine : X.health[l.health], `400 16px ${fam}`, lineW)}</div>`;
  }

  // Other live notices: all of faults except the one shown as the line (2.3).
  const others = sc.faults.filter((f) => !(sc.line && sc.line.fault === f));
  const rowW = ww - 40 - 32 - 16 - 12;
  function noticeText(f) {
    const HB = `700 14px ${fam}`, AR = `400 14px ${fam}`;
    const one = M(HB, X.plain(f.headline)) + (f.action ? 16 + M(AR, X.plain(f.action)) : 0) <= rowW;
    if (one) return `<div class="t"><b>${esc(X.plain(f.headline))}</b>${f.action ? `<span>${esc(X.plain(f.action))}</span>` : ""}</div>`;
    return `<div class="t col"><b>${wrapHtml(f.headline, HB, rowW)}</b>${f.action ? `<span>${wrapHtml(f.action, AR, rowW)}</span>` : ""}</div>`;
  }
  const noticesHtml = others.length
    ? `<div class="notices">${others.map((f) => `<div class="notice">${I.state(f.resolved ? "ok" : "fault", 16, grey ? "var(--muted)" : f.resolved ? "var(--ok)" : "var(--fault)")}` +
        noticeText(f) + `</div>`).join("")}</div>`
    : "";

  // Dongle (2.3): pictogram lit when connected, the word with the same marks as the rows.
  const dk = sc.dongle;
  const dongleWord = dk === "on"
    ? `${I.state("ok", 10, grey ? "var(--muted)" : "var(--ok)")}<span style="color:${grey ? "var(--ink-2)" : "var(--ink)"}">${W.dongle.on}</span>`
    : dk === "off" ? `${I.state("none", 10, "var(--idle)")}<span style="color:var(--ink-2)">${W.dongle.off}</span>`
    : `<span style="color:var(--ink-2)">${W.dongle.unknown}</span>`;
  const dongleHtml = `<div class="dongle">${I.dongle(dk === "on" ? (grey ? "grey" : "on") : dk, K)}` +
    `<div class="t"><span class="k">${W.dongleName}</span><span class="v">${dongleWord}</span></div></div>`;

  // Count over the rows (2.5): shown when the values are current (not greyed, VIVE Hub running).
  const showCount = !grey && !(sc.line && sc.line.hub);
  const countHtml = showCount && sc.devices.length
    ? `<span class="count">${esc(X.tracking("\u0000", "\u0001")).replace("\u0000", `<b>${sc.devices.filter((d) => d.state === "ok").length}</b>`).replace("\u0001", `<b>${sc.devices.length}</b>`)}</span>`
    : `<span></span>`;

  // No tracker yet: one row with the dark pictogram only, no words (2.5).
  const rows = sc.devices.length ? sc.devices.map(row).join("")
    : row({ serial: "", tail: "", link: "none", state: null, fw: null }, -1).replace('class="tr row off"', 'class="tr row off ghost"')
        .replace(/<div class="name">.*?<\/div><div class="ser">.*?<\/div>/, "");
  const overall = sc.overall;

  document.getElementById("win").innerHTML =
    `<div class="titlebar"><canvas class="mk" data-glyph="${overall}" data-size="32" data-dpr="2" data-color="--icon-${overall}"></canvas><span>OpenUT</span><div class="btns"><span>—</span><span>☐</span><span>✕</span></div></div>` +
    `<div class="client${grey ? " grey" : ""}" style="width:${ww}px;height:${wh}px"><div class="scroll">` +
      `<div class="status"><div class="overall" style="color:${col[overall]}">${I.state(overall, 22, col[overall])}<span>${W.overall[overall]}</span></div>` +
        `<div class="line">${lineHtml()}</div>` +
        (sc.pickFolder ? `<span class="btn fill">${W.pickFolder}</span>` : "<span></span>") + dongleHtml + `</div>` +
      noticesHtml +
      `<div class="ops">` +
        ["pair", "setup"].map((k) => `<div class="op"><span>${W.ops[k].name}</span><span class="btn">${W.ops[k].button}</span></div>`).join("") +
        `<div class="gearbtn" title="${W.settings}">${I.gear()}</div></div>` +
      `<div class="listhead">${countHtml}<span class="btn small">${W.allOff}</span></div>` +
      `<div class="table"><div class="tr th"><span>${W.cols.tracker}</span><span>${W.cols.state}</span><span>${W.cols.battery}</span>` +
        `<span>${W.cols.firmware}</span><span>${W.cols.actions}</span></div>${rows}</div>` +
    `</div></div>`;
  document.title = "OpenUT メインウィンドウ " + key + " " + sc.title;

  // The status panel keeps its height; it grows only when the line needs more than 3 lines (2.3).
  const status = document.querySelector(".status"), line = document.querySelector(".line");
  if (line.scrollHeight > 96) status.classList.add("tall");

  // Vertical overflow: the whole column scrolls (2.2). Show the scroll bar of egui.
  const client = document.querySelector(".client"), scroll = document.querySelector(".scroll");
  const contentH = Array.from(scroll.children).reduce((h, el) => {
    const s = getComputedStyle(el);
    return h + el.offsetHeight + parseFloat(s.marginTop) + parseFloat(s.marginBottom);
  }, 32);
  if (contentH > wh + 1) {
    client.classList.add("cut");
    const vb = document.createElement("div");
    vb.className = "vbar";
    vb.style.height = Math.round(((wh - 32) * wh) / contentH) + "px";
    client.appendChild(vb);
  }
  window.OpenUTLayout = { whoText, fwText, lineW, rowW, contentH, statusH: status.offsetHeight,
    rowH: Array.from(document.querySelectorAll(".row")).map((r) => r.offsetHeight) };
})();
</script>
</body>
</html>
