<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenUT VR の案内</title>
<link rel="stylesheet" href="tokens.css">
<script src="glyph.js"></script>
<style>
  body { padding: 24px; }
  .cap { font-size: 13px; color: #4D5768; margin: 0 0 8px 2px; }

  /* The panel is laid out in texture pixels (1280 wide). zoom maps it to the page:
     0.5 = one texture pixel per device pixel in a deviceScaleFactor 2 screenshot. */
  .panel { width: 1280px; display: grid; grid-template-columns: 80px 1fr; column-gap: 36px;
           padding: 52px 64px 56px 56px; border-radius: 28px; background: var(--vr-panel);
           box-shadow: inset 0 0 0 3px var(--vr-edge); font-family: var(--font); }
  .panel canvas { margin-top: 0; }
  .panel .h { margin: 0; font-size: 64px; line-height: 80px; font-weight: 700; color: var(--vr-ink); }
  .panel .a { margin: 12px 0 0; font-size: 54px; line-height: 73px; font-weight: 400; color: var(--vr-ink-2); }

  #vr-panels { display: inline-grid; gap: 20px; padding: 24px; background: #7F8A93; }
  #vr-panels .panel { zoom: 0.5; }

  /* Field of view: 100 degrees across the frame. Panel 24.1 degrees wide, centre 10.6 degrees below. */
  #vr-view { display: inline-grid; grid-template-columns: 800px 800px; gap: 16px; padding: 16px; background: #E3E7EC; }
  .view { position: relative; width: 800px; height: 450px; overflow: hidden; border-radius: 6px; }
  .view .anchor { position: absolute; left: 50%; top: calc(50% + 85px); transform: translate(-50%, -50%); z-index: 1; }
  .view .panel { zoom: 0.1508; }
  .room { background:
      linear-gradient(to bottom, #3B3F47 0%, #565A60 52%, #2C2A28 52%, #46403A 100%); }
  .room::before { content: ""; position: absolute; inset: 52% 0 0; background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 2px, transparent 2px 80px); }
  .room::after { content: ""; position: absolute; left: 140px; top: 70px; width: 220px; height: 150px;
      background: #D9C99A; opacity: .55; border-radius: 4px; box-shadow: 380px 30px 0 -20px #8FA4B8; }
  .day { background: linear-gradient(to bottom, #BFD8EE 0%, #E9F1F6 50%, #B9C49A 50%, #7E8F5E 100%); }
  .day::after { content: ""; position: absolute; left: 520px; top: 60px; width: 120px; height: 120px;
      border-radius: 50%; background: #FFF8DC; filter: blur(8px); }
  .cross { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; transform: translate(-50%, -50%);
           border: 1.5px solid rgba(255,255,255,.7); border-radius: 50%; z-index: 1; }
  .day .cross { border-color: rgba(0,0,0,.45); }
</style>
</head>
<body>

<p class="cap">板（テクスチャーの画素のまま。幅 1280）</p>
<div id="vr-panels">
  <div class="panel" id="vr-r1">
    <canvas data-glyph="normal" data-size="80" data-color="--vr-signal"></canvas>
    <div><p class="h">トラッカーが始まりません</p><p class="a">腰の電源だけを入れ直す。<br>ほかのトラッカーとドングルはそのまま</p></div>
  </div>
  <div class="panel" id="vr-r1-more">
    <canvas data-glyph="normal" data-size="80" data-color="--vr-signal"></canvas>
    <div><p class="h">トラッカーがまだ始まりません<br>（ほか1件）</p><p class="a">腰の電源だけを入れ直す。<br>ほかのトラッカーとドングルはそのまま</p></div>
  </div>
  <div class="panel" id="vr-r3">
    <canvas data-glyph="normal" data-size="80" data-color="--vr-signal"></canvas>
    <div><p class="h">トラッカー3の位置合わせが<br>終わりません</p><p class="a">手に持って、部屋の中をゆっくり見せる</p></div>
  </div>
  <div class="panel" id="vr-r1-ok">
    <canvas data-glyph="normal" data-size="80" data-color="--vr-ok"></canvas>
    <div><p class="h">始まらない状態が直りました</p></div>
  </div>
</div>

<p class="cap" style="margin-top:28px">視野の中（横 100°。板は幅 24°、中心は 10.6° 下）</p>
<div id="vr-view">
  <div class="view room"><span class="cross"></span>
    <div class="anchor"><div class="panel">
      <canvas data-glyph="normal" data-size="80" data-color="--vr-signal"></canvas>
      <div><p class="h">トラッカーが始まりません</p><p class="a">腰の電源だけを入れ直す。<br>ほかのトラッカーとドングルはそのまま</p></div>
    </div></div>
  </div>
  <div class="view day"><span class="cross"></span>
    <div class="anchor"><div class="panel">
      <canvas data-glyph="normal" data-size="80" data-color="--vr-signal"></canvas>
      <div><p class="h">左足が地図を受け取れていません</p><p class="a">腰の近くに置いて待つ</p></div>
    </div></div>
  </div>
</div>
</body>
</html>
